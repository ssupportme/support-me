name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  env-example-drift:
    name: Check .env.example drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare shared contract IDs across frontend/.env.example and backend/.env.example
        run: node scripts/check-env-example-drift.js

  contracts:
    name: Contracts (Rust/Soroban)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run unit tests
        run: cargo test --workspace --locked

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The deployable artifact is the optimized build: the raw cargo output is
      # well over the size budget. Pinned to a commit SHA; the action takes the
      # CLI version from `version` when it is not called by tag.
      - name: Install stellar-cli
        uses: stellar/stellar-cli@28484880988199233a7e8e87c97cb12dac323cb3 # v25.2.0
        with:
          version: 25.2.0

      - name: Build contracts to WASM (optimized)
        run: stellar contract build --optimize --locked

      - name: Check WASM artifact size budget
        run: |
          MAX_SIZE=65536
          REGISTRY_SIZE=$(wc -c < target/wasm32v1-none/release/creator_registry.wasm | tr -d ' ')
          DONATION_SIZE=$(wc -c < target/wasm32v1-none/release/donation.wasm | tr -d ' ')
          echo "creator_registry.wasm: $REGISTRY_SIZE bytes (limit: $MAX_SIZE bytes)"
          echo "donation.wasm: $DONATION_SIZE bytes (limit: $MAX_SIZE bytes)"
          if [ "$REGISTRY_SIZE" -gt "$MAX_SIZE" ] || [ "$DONATION_SIZE" -gt "$MAX_SIZE" ]; then
            echo "Error: Contract WASM artifact exceeds size budget of $MAX_SIZE bytes!"
            exit 1
          fi

      # Run on the current stable toolchain, not the project's pin: cargo-audit
      # raises its minimum Rust version independently of the contracts' pin,
      # and `cargo install` inside the repo would otherwise pick up
      # rust-toolchain.toml and fail to compile it. `+stable` bypasses the pin;
      # `cargo audit` only reads Cargo.lock, so it does not need the pin either.
      - name: Security advisory scan
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-audit --locked
          cargo +stable audit

  backend:
    name: Backend (Node/Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supportme?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supportme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (Prisma client + TypeScript)
        run: npm run build

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Check migrations match schema.prisma (drift)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE prisma_shadow;'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/prisma_shadow?schema=public" \
            --exit-code

      - name: Seed demo data twice (idempotency smoke, #280)
        run: |
          npx prisma db seed
          npx prisma db seed
        env:
          NODE_ENV: test

      - name: Run tests
        run: npm test

      - name: Run Postgres integration tests
        run: npm run test:integration

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Check translation message key parity
        run: npm run check:i18n

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Diffs the base and head refs' dependency manifests, so it only has
    # something to compare on a pull request (a push to main has no "before"
    # side to diff in that sense here).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # Flags a pull request that newly introduces a high-severity (or
      # above) vulnerable dependency, without failing on vulnerabilities
      # that already exist on main: unlike a flat `npm audit
      # --audit-level=high` step, which would fail on every PR today given
      # this repo's existing dependency tree (see TESTING.md).
      - name: Scan dependency changes for new vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  type-drift:
    name: Check Type Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check contract event structs match docs/architecture/contract-events.md
        run: node scripts/check-contract-event-drift.js

  test-all:
    name: All tests passed
    runs-on: ubuntu-latest
    # dependency-review only runs on pull_request (see its own `if:` above),
    # so on a push to main it reports "skipped" rather than succeeding; allow
    # that specific outcome through rather than blocking test-all on it.
    if: always()
    needs: [env-example-drift, contracts, backend, frontend, e2e, dependency-review, type-drift]
    steps:
      - name: Fail if any required job did not succeed or get skipped
        run: |
          echo "${{ toJSON(needs) }}"
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job did not succeed."
              exit 1
            fi
          done
      - run: echo "All test suites and checks passed."
